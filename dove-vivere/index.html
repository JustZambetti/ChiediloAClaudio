<title>Dove vivere in Europa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: pannello criteri fisso a sinistra, classifica a destra; targhe UE come segno distintivo delle città */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --sunken: #e4e8ee;
  --ink: #18202c;
  --muted: #5a6475;
  --line: #d6dce5;
  --accent: #8a1c3c;        /* bordeaux passaporto */
  --accent-soft: #f3dfe5;
  --plate: #1f3a93;         /* blu targa UE */
  --plate-ink: #ffd34d;
  --star: #c48a12;
  --good: #1d7a4a;
  --bad: #b3261e;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --surface: #171c25; --sunken: #1e2430; --ink: #e6eaf1; --muted: #9aa3b3;
    --line: #2a3240; --accent: #e5718f; --accent-soft: #3a1d27; --plate: #2b4bb3; --plate-ink: #ffd34d;
    --star: #e8b84a; --good: #4cc286; --bad: #f2786d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171c25; --sunken: #1e2430; --ink: #e6eaf1; --muted: #9aa3b3;
  --line: #2a3240; --accent: #e5718f; --accent-soft: #3a1d27; --plate: #2b4bb3; --plate-ink: #ffd34d;
  --star: #e8b84a; --good: #4cc286; --bad: #f2786d; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1340px; margin: 0 auto; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px 24px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; max-width: 100%; background: var(--sunken); padding: 4px; border-radius: 999px; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; font-weight: 500; font-size: 14px; white-space: nowrap; }
nav.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
nav.tabs a .badge { font-family: var(--f-data); font-size: 11px; background: var(--accent); color: var(--surface); border-radius: 999px; padding: 0 6px; margin-left: 4px; }

/* Layout */
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; padding-block: 20px 48px; align-items: start; }
aside.panel { position: sticky; top: 74px; max-height: calc(100vh - 92px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
.panel-toggle { display: none; }
@media (max-width: 920px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside.panel { position: static; max-height: none; display: none; }
  aside.panel.open { display: flex; }
  .panel-toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-weight: 600; }
  nav.tabs { margin-left: 0; width: 100%; }
  nav.tabs a { flex: 1; text-align: center; padding-inline: 8px; }
}
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.panel section { display: flex; flex-direction: column; gap: 10px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
.chip-btn:hover { border-color: var(--accent); }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

.field { display: grid; gap: 4px; }
.field label, .field .lab { font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
.field .lab output { font-family: var(--f-data); color: var(--muted); font-weight: 400; }
input[type="number"], input[type="search"], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.check { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; }

details.group { border-top: 1px solid var(--line); padding-top: 10px; }
details.group > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::after { content: "+"; font-family: var(--f-data); color: var(--muted); }
details.group[open] > summary::after { content: "−"; }
details.group > summary small { font-weight: 400; color: var(--muted); font-family: var(--f-data); font-size: 12px; margin-left: auto; margin-right: 10px; }
.wlist { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.wrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; }
.wrow .wl { font-size: 13px; min-width: 0; }
.wrow .wl.off { color: var(--muted); }
.wrow .pips { display: flex; gap: 3px; }
.pip { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); padding: 0; }
.pip.on { background: var(--accent); border-color: var(--accent); }
.pip.zero { width: 18px; font-size: 11px; line-height: 1; color: var(--muted); font-family: var(--f-data); }
.inv { grid-column: 1 / -1; justify-self: start; font-size: 12px; border: 1px dashed var(--line); background: none; border-radius: 6px; padding: 1px 7px; color: var(--muted); }
.inv:hover { color: var(--ink); border-color: var(--accent); }

/* Classifica */
.view-head { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 20px; margin-bottom: 14px; }
.view-head h2 { font-size: 28px; font-weight: 700; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.view-head .sort { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.view-head .sort select { width: auto; }
ol.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: 30px 52px minmax(0, 1.25fr) minmax(0, 1.7fr) 128px 64px; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; transition: border-color .15s; }
.row:hover { border-color: var(--accent); }
.row.top3 { border-left: 3px solid var(--accent); }
.pos { font-family: var(--f-data); color: var(--muted); font-size: 13px; text-align: right; }
.plate { display: inline-flex; align-items: stretch; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; height: 24px; font-family: var(--f-data); font-weight: 500; font-size: 12px; background: var(--surface); }
.plate b { background: var(--plate); color: var(--plate-ink); padding: 0 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 9px; line-height: 1; gap: 1px; }
.plate b::before { content: "★"; font-size: 7px; }
.plate i { font-style: normal; padding: 0 5px; display: flex; align-items: center; letter-spacing: .04em; }
.who { min-width: 0; }
.who strong { font-family: var(--f-display); font-size: 17px; font-weight: 700; display: block; }
.who small { color: var(--muted); font-size: 12.5px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 6px; min-width: 0; }
.fact { font-family: var(--f-data); font-size: 12px; background: var(--bg); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.fact.good { color: var(--good); }
.fact.bad { color: var(--bad); }
.why { width: 100%; font-size: 12px; color: var(--muted); }
.why .p { color: var(--good); }
.why .m { color: var(--bad); }
.score { display: grid; gap: 4px; }
.score b { font-family: var(--f-data); font-size: 20px; font-weight: 500; line-height: 1; }
.score b small { font-size: 11px; color: var(--muted); }
.bar { height: 6px; background: var(--sunken); border-radius: 999px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.acts { display: flex; gap: 4px; justify-content: flex-end; }
.icon-btn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 15px; line-height: 1; color: var(--muted); padding: 0; }
.icon-btn:hover { border-color: var(--accent); color: var(--ink); }
.icon-btn.fav-on { color: var(--star); border-color: var(--star); }
.icon-btn.cmp-on { color: var(--surface); background: var(--accent); border-color: var(--accent); }
@media (max-width: 760px) {
  .row { grid-template-columns: 24px 48px minmax(0, 1fr) 64px; gap: 8px 10px; }
  .row .facts { grid-column: 2 / -1; grid-row: 2; }
  .row .score { grid-column: 3 / 4; grid-row: 3; }
  .row .acts { grid-column: 4; grid-row: 3; }
  .row .score, .row .acts { align-self: center; }
}
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; text-align: center; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 13px; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Drawer dettaglio */
.scrim { position: fixed; inset: 0; background: rgb(10 14 20 / .45); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--surface); z-index: 41; overflow: auto; border-left: 1px solid var(--line); padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 20px; display: flex; flex-direction: column; gap: 20px; overscroll-behavior: contain; }
.d-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.d-head h2 { font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.d-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.d-score { display: flex; align-items: baseline; gap: 8px; }
.d-score b { font-family: var(--f-data); font-size: 34px; font-weight: 500; color: var(--accent); }
.d-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.note { background: var(--bg); border-radius: var(--r); padding: 12px 14px; font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--bg); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.tile span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tile b { font-family: var(--f-data); font-weight: 500; font-size: 16px; }
@media (max-width: 480px) { .tiles { grid-template-columns: 1fr 1fr; } }
.mgroup h3 { font-size: 15px; margin-bottom: 6px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) 90px 44px; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.mrow .mv { font-family: var(--f-data); font-size: 12.5px; }
.mrow .mr { font-family: var(--f-data); font-size: 11.5px; color: var(--muted); text-align: right; }
.mrow.w0 .ml { color: var(--muted); }
.mrow.w0 .bar span { background: var(--muted); opacity: .5; }
.mrow input { padding: 3px 6px; font-family: var(--f-data); font-size: 12.5px; }
.tax-box { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: grid; gap: 4px; }

/* Confronto */
.cmp-pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.cmp-pick select { width: auto; min-width: 200px; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px; }
.tag button { border: 0; background: var(--sunken); border-radius: 999px; width: 20px; height: 20px; padding: 0; line-height: 1; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table.cmp { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.cmp th, table.cmp td { padding: 7px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.cmp thead th { position: sticky; top: 0; background: var(--surface); font-family: var(--f-display); font-size: 16px; }
table.cmp td.v { font-family: var(--f-data); font-size: 12.5px; white-space: nowrap; }
table.cmp td.best { color: var(--good); font-weight: 500; }
table.cmp td.best::after { content: " ▲"; font-size: 9px; }
table.cmp tr.grp th { background: var(--bg); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
table.cmp th.crit { font-weight: 500; min-width: 170px; }

/* Metodo */
.prose { max-width: 75ch; display: flex; flex-direction: column; gap: 14px; }
.prose p { margin: 0; }
.prose h3 { font-size: 19px; margin-top: 10px; }
.warn { border-left: 3px solid var(--star); background: var(--surface); padding: 12px 14px; border-radius: 0 var(--r) var(--r) 0; }
table.src { border-collapse: collapse; width: 100%; font-size: 13px; }
table.src th, table.src td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.src th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.io { display: grid; gap: 8px; }
.io textarea { min-height: 110px; font-family: var(--f-data); font-size: 12px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.msg { font-size: 13px; color: var(--good); }
/* Questionario */
body[data-view="questionario"] aside.panel, body[data-view="questionario"] .panel-toggle { display: none !important; }
body[data-view="questionario"] .layout { grid-template-columns: minmax(0, 1fr); max-width: 820px; }
.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--accent-soft); border-radius: var(--r); padding: 12px 16px; margin-bottom: 14px; font-size: 14px; }
.cta a { color: var(--accent); font-weight: 600; }
form.quiz { display: flex; flex-direction: column; gap: 14px; }
fieldset.q { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px 18px; margin: 0; min-width: 0; display: grid; gap: 10px; }
fieldset.q.done { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
fieldset.q legend { float: left; width: 100%; padding: 0; font-family: var(--f-display); font-weight: 700; font-size: 18px; display: flex; gap: 10px; align-items: baseline; }
fieldset.q legend + * { clear: both; }
.qn { font-family: var(--f-data); font-size: 12px; font-weight: 500; color: var(--muted); min-width: 22px; }
.qh { margin: 0; color: var(--muted); font-size: 13.5px; }
.qtag { font-family: var(--f-body); font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: var(--bg); }
.opt:hover { border-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { accent-color: var(--accent); margin: 3px 0 0; flex: none; }
.opt b { display: block; font-weight: 600; font-size: 14px; }
.opt small { display: block; color: var(--muted); font-size: 12.5px; }
.qfoot { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; }
.qfoot .prog { display: grid; gap: 5px; min-width: 0; font-size: 13px; color: var(--muted); }
.qfoot .prog strong { color: var(--ink); }
.qfoot .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) { .qfoot { grid-template-columns: minmax(0, 1fr); } .qfoot .btns { justify-content: stretch; } .qfoot .btns .btn { flex: 1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top gutter">
  <div class="inner top-row">
    <div class="brand"><h1>Dove vivere</h1><span id="brandCount">città e comuni europei a confronto</span></div>
    <nav class="tabs" aria-label="Sezioni">
      <a href="#questionario" data-view="questionario">Questionario</a>
      <a href="#classifica" data-view="classifica">Classifica</a>
      <a href="#confronta" data-view="confronta">Confronta <span class="badge" id="cmpCount" hidden>0</span></a>
      <a href="#metodo" data-view="metodo">Dati</a>
    </nav>
  </div>
</header>

<div class="gutter">
<div class="inner layout">
  <button class="panel-toggle" id="panelToggle" aria-expanded="false" aria-controls="panel"><span>Criteri e filtri</span><span class="num" id="panelSummary"></span></button>
  <aside class="panel" id="panel" aria-label="Criteri e filtri">
    <section>
      <div class="eyebrow">Parti da un profilo</div>
      <div class="presets" id="presets"></div>
    </section>
    <section>
      <div class="eyebrow">Dove vivi ora</div>
      <div class="field"><label for="homeId">Posto attuale</label><select id="homeId"></select></div>
      <div class="field"><div class="lab"><label for="homeRent">Quanto paghi di affitto</label><output>€/mese</output></div><input type="number" id="homeRent" min="0" step="50"></div>
    </section>
    <section>
      <div class="eyebrow">Paletti (escludono posti)</div>
      <div class="field"><label for="fSize">Dimensione</label><select id="fSize"><option value="all">Tutti</option><option value="big">Grandi città (oltre 1 milione)</option><option value="mid">Città medie (200 mila – 1 milione)</option><option value="small">Piccole città e comuni (sotto 200 mila)</option></select></div>
      <div class="field"><input type="search" id="q" placeholder="Cerca città o paese…" aria-label="Cerca città o paese"></div>
      <div class="field">
        <div class="lab"><label for="budget">Il tuo reddito netto mensile</label><output>opzionale</output></div>
        <input type="number" id="budget" min="0" step="100" placeholder="es. 2500 € (se lavori da remoto)">
      </div>
      <div class="field"><div class="lab"><label for="rentMax">Affitto massimo</label><output id="rentMaxOut" class="num"></output></div><input type="range" id="rentMax" min="400" max="3000" step="50"></div>
      <div class="field"><div class="lab"><label for="janMin">Gennaio almeno</label><output id="janMinOut" class="num"></output></div><input type="range" id="janMin" min="-5" max="18" step="1"></div>
      <div class="field"><div class="lab"><label for="safetyMin">Sicurezza minima</label><output id="safetyMinOut" class="num"></output></div><input type="range" id="safetyMin" min="0" max="85" step="5"></div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="fNoVisa"> Senza visto (UE)</label>
        <label class="check"><input type="checkbox" id="fEuro"> Solo euro</label>
        <label class="check"><input type="checkbox" id="fNoIT"> Escludi Italia</label>
        <label class="check"><input type="checkbox" id="fSea"> Mare entro 1h</label>

}

  budget: '', fav: {}, notes: {}, compare: [], overrides: {}, sort: 'score', quiz: {}, myProfile: null,
});
let state = DEFAULT_STATE();
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) state = merge(DEFAULT_STATE(), s); } catch (e) {}
function merge(base, s) {
  const out = {...base, ...s};
  out.f = {...base.f, ...(s.f || {})};
  out.weights = {...base.weights, ...(s.weights || {})};
  out.home = {...base.home, ...(s.home || {})};
  out.compare = (s.compare || []).slice(0, 4);
  return out;
}
let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }, 200); }

/* ---------------- CALCOLO ---------------- */
let cities = [], homeCity = null;
function compute() {
  cities = allBase().map(c => {
    const x = {...c, ...(state.overrides[c.id] || {})};
    x.cost = Math.round(x.rent + x.costIdx * 15);
    x.ppp = x.salary / x.cost;
    return x;
  });
  const home = cities.find(c => c.id === state.home.id) || cities.find(c => c.id === 'madrid');
  homeCity = home;
  const myRent = Number(state.home.rent) || home.rent;
  cities.forEach(c => {
    c.myRent = Math.round(c.rent * myRent / home.rent / 10) * 10;
    c.rentDelta = c.myRent - myRent;
    c.costVsHome = c.cost / home.cost - 1;
    c.isHome = c.id === home.id;
  });
  const tv = (cr, c) => cr.log ? Math.log(cr.v(c)) : cr.v(c);
  CRIT.forEach(cr => { const vs = cities.map(c => tv(cr, c)); cr.min = Math.min(...vs); cr.max = Math.max(...vs); });
  cities.forEach(c => {
    c.norm = {}; let sw = 0, s = 0;
    CRIT.forEach(cr => {
      let n = (tv(cr, c) - cr.min) / ((cr.max - cr.min) || 1);
      const dir = cr.dir * (state.inv[cr.k] ? -1 : 1);
      if (dir < 0) n = 1 - n;
      c.norm[cr.k] = n;
      const w = state.weights[cr.k] || 0;
      if (w > 0) { sw += w; s += w * n; }
    });
    c.score = sw ? Math.round(s / sw * 100) : 0;
    c.rk = {};
  });
  CRIT.forEach(cr => {
    const sorted = [...cities].sort((a, b) => b.norm[cr.k] - a.norm[cr.k]);
    sorted.forEach((c, i) => { c.rk[cr.k] = i > 0 && sorted[i-1].norm[cr.k] === c.norm[cr.k] ? sorted[i-1].rk[cr.k] : i + 1; });
  });
  const byScore = [...cities].sort((a, b) => b.score - a.score);
  byScore.forEach((c, i) => c.overall = i + 1);
}
const budgetVal = () => Number(state.budget) || 0;
function passes(c) {
  const f = state.f, q = f.q.trim().toLowerCase();
  if (q && !(c.name.toLowerCase().includes(q) || c.country.toLowerCase().includes(q))) return false;
  if (c.rent > f.rentMax) return false;
  if (c.janT < f.janMin) return false;
  if (c.safety < f.safetyMin) return false;
  if (f.noVisa && c.status === 'UK') return false;
  if (f.euro && !c.euro) return false;
  if (f.noIT && c.cc === 'IT') return false;
  if (f.sea && c.sea < 1) return false;
  if (f.mount && c.mount < 1) return false;
  if (f.budget && budgetVal() && budgetVal() < c.cost) return false;
  if (f.fav && !state.fav[c.id]) return false;
  if (f.size === 'big' && c.pop < 1) return false;
  if (f.size === 'mid' && (c.pop < 0.2 || c.pop >= 1)) return false;
  if (f.size === 'small' && c.pop >= 0.2) return false;
  return true;
}
const label = cr => state.inv[cr.k] ? cr.il : cr.l;
const short = cr => state.inv[cr.k] ? cr.is : cr.s;
function why(c) {
  const act = CRIT.filter(cr => (state.weights[cr.k] || 0) > 0);
  const plus = act.filter(cr => c.norm[cr.k] >= 0.72).sort((a, b) => (state.weights[b.k] * c.norm[b.k]) - (state.weights[a.k] * c.norm[a.k])).slice(0, 3);
  const minus = act.filter(cr => state.weights[cr.k] >= 2 && c.norm[cr.k] <= 0.3).sort((a, b) => (state.weights[b.k] * (1 - c.norm[b.k])) - (state.weights[a.k] * (1 - c.norm[a.k]))).slice(0, 2);
  return {plus, minus};
}

const pctTxt = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(Math.round(n * 100)) + '%';
const deltaTxt = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + nf.format(Math.abs(n));
function factChips(c) {
  const b = budgetVal();
  const left = b ? b - c.cost : null;
  const chips = [
    c.isHome ? `<span class="fact" style="color:var(--accent)">vivi qui · affitto ${eur(Number(state.home.rent) || c.rent)}</span>` : `<span class="fact ${c.rentDelta <= 0 ? 'good' : 'bad'}" title="Stima di quanto pagheresti per una casa equivalente alla tua">casa come la tua ≈ ${eur(c.myRent)} (${deltaTxt(c.rentDelta)})</span>`,
    `<span class="fact" title="Costo della vita totale rispetto a ${esc(homeCity.name)}">${eur(c.cost)}/mese${c.isHome ? '' : ' · ' + pctTxt(c.costVsHome)}</span>`,
    `<span class="fact">${sgn(c.janT)}° gen</span>`,
    `<span class="fact">${nf.format(c.sun)} h sole</span>`,
    `<span class="fact">sicur. ${c.safety}</span>`,
  ];
  if (left !== null) chips.push(`<span class="fact ${left >= 0 ? 'good' : 'bad'}">${left >= 0 ? 'ti restano ' : 'mancano '}${eur(Math.abs(left))}</span>`);
  if (c.status === 'UK') chips.push(`<span class="fact bad">serve visto</span>`);
  const w = why(c);
  const whyTxt = [w.plus.length ? `<span class="p">+ ${w.plus.map(short).join(', ')}</span>` : '', w.minus.length ? `<span class="m">− ${w.minus.map(short).join(', ')}</span>` : ''].filter(Boolean).join(' · ');
  return chips.join('') + (whyTxt ? `<div class="why">${whyTxt}</div>` : '');
}

      <button class="btn ${state.compare.includes(c.id) ? 'primary' : ''}" data-cmp="${c.id}">${state.compare.includes(c.id) ? '⇄ Nel confronto' : '⇄ Confronta'}</button>
      <button class="btn" id="dEdit">${editing ? 'Fine correzioni' : 'Correggi i dati'}</button>
      ${Object.keys(ov).length ? `<button class="btn danger" id="dResetOv">Ripristina dati originali</button>` : ''}
      ${c.custom ? `<button class="btn danger" id="dDelCustom">Elimina questo posto</button>` : ''}
    </div>
    <div class="note">${esc(c.note)}</div>
    <div class="tiles">${tiles.map(([k, v]) => `<div class="tile"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`;
  if (editing) {
    body += `<div class="mgroup"><h3>Correggi i dati</h3><p style="margin:0 0 8px;color:var(--muted);font-size:13px">Le modifiche restano solo nel tuo browser e ricalcolano subito la classifica. I campi evidenziati sono quelli che hai cambiato.</p>` +
      EDIT.map(([k, l, u]) => `<div class="mrow" style="grid-template-columns:minmax(0,1fr) 120px 50px"><label class="ml" for="ed-${k}" style="${k in ov ? 'color:var(--accent);font-weight:600' : ''}">${esc(l)}</label><input type="number" step="any" id="ed-${k}" data-ed="${k}" value="${c[k]}"><span class="mr">${esc(u)}</span></div>`).join('') + `</div>`;
  } else {
    GROUPS.forEach(g => {
      body += `<div class="mgroup"><h3>${esc(g)}</h3>` + CRIT.filter(cr => cr.g === g).map(cr => {
        const w = state.weights[cr.k] || 0;
        return `<div class="mrow ${w ? '' : 'w0'}"><span class="ml" title="${esc(cr.d)}">${esc(label(cr))}</span><span class="mv">${esc(cr.fmt(c))}</span><div class="bar" title="Posizione relativa"><span style="width:${Math.max(3, c.norm[cr.k] * 100)}%"></span></div><span class="mr">#${c.rk[cr.k]}</span></div>`;
      }).join('') + `</div>`;
    });
  }
  body += `<div class="tax-box"><strong>Fisco per chi si trasferisce</strong><span>${esc(c.regime)}</span><span style="color:var(--muted);font-size:12.5px">Prelievo standard su 50.000 € lordi: circa ${dec(c.tax)}%. I regimi cambiano spesso: verifica requisiti e scadenze con un commercialista.</span></div>
    <div class="field"><label for="dNotes">I tuoi appunti</label><textarea id="dNotes" rows="4" placeholder="Es. amici in città, costo asilo, visita prevista a marzo…">${esc(state.notes[c.id] || '')}</textarea></div>`;
  d.innerHTML = body;
}
function openDrawer(id) { openId = id; editing = false; renderDrawer(); $('#drawer').hidden = false; $('#scrim').hidden = false; $('#dClose').focus(); }
function closeDrawer() { openId = null; $('#drawer').hidden = true; $('#scrim').hidden = true; }

function render() {
  compute();
  renderRanking();
  renderCompare();
  if (openId) renderDrawer();
  save();
}

/* ---------------- VISTE ---------------- */
const VIEWS = ['questionario', 'classifica', 'confronta', 'metodo'];
function route() {
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'classifica';
  document.body.dataset.view = v;
  document.querySelectorAll('[data-viewpane]').forEach(el => el.hidden = el.dataset.viewpane !== v);
  document.querySelectorAll('nav.tabs a').forEach(a => { if (a.dataset.view === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
window.addEventListener('hashchange', route);

/* ---------------- EVENTI ---------------- */
function toggleFav(id) { if (state.fav[id]) delete state.fav[id]; else state.fav[id] = true; }
function toggleCmp(id) {
  const i = state.compare.indexOf(id);
  if (i >= 0) state.compare.splice(i, 1);
  else { if (state.compare.length >= 4) state.compare.shift(); state.compare.push(id); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open]');
  if (!t) return;
  if (t.dataset.preset) {
    const p = t.dataset.preset === 'Il mio profilo' ? {n:'Il mio profilo', ...state.myProfile} : PRESETS.find(x => x.n === t.dataset.preset);
    state.weights = {...p.w}; state.inv = {...p.inv}; state.preset = p.n;
    renderPresets(); renderWeights(); render(); return;
  }
  if (t.dataset.w) {
    const [k, v] = t.dataset.w.split(':');
    state.weights[k] = Number(v); state.preset = '';
    renderPresets(); renderWeights(); render(); return;
  }
  if (t.dataset.inv) {
    const k = t.dataset.inv; state.inv[k] = !state.inv[k]; state.preset = '';
    if (!state.weights[k]) state.weights[k] = 2;
    renderPresets(); renderWeights(); render(); return;
  }
  if (t.dataset.fav) { e.stopPropagation(); toggleFav(t.dataset.fav); render(); return; }
  if (t.dataset.cmp) { e.stopPropagation(); toggleCmp(t.dataset.cmp); render(); return; }
  if (t.id === 'clearFilters') { state.f = DEFAULT_STATE().f; syncFilters(); render(); return; }
  if (t.id === 'dClose') { closeDrawer(); return; }
  if (t.id === 'dEdit') { editing = !editing; renderDrawer(); return; }
  if (t.id === 'dDelCustom') {
    const id = openId; state.custom = state.custom.filter(x => x.id !== id); delete state.overrides[id]; delete state.fav[id]; delete state.notes[id];
    state.compare = state.compare.filter(x => x !== id); if (state.home.id === id) state.home.id = 'madrid';
    closeDrawer(); syncFilters(); render(); return;
  }
  if (t.id === 'newAdd') {
    const name = $('#newName').value.trim(), from = $('#newFrom').value;
    if (!name) { $('#newMsg').textContent = 'Scrivi il nome del posto da aggiungere.'; $('#newMsg').style.color = 'var(--bad)'; return; }
    let id = 'mio-' + slug(name), n = 2; while (allBase().some(c => c.id === id)) id = 'mio-' + slug(name) + '-' + n++;
    const src = BASE.find(b => b.id === from);
    state.custom.push({id, name, from, note: `Aggiunto da te. I valori sono copiati da ${src.name}: correggili con "Correggi i dati".`});
    syncFilters(); render(); openDrawer(id); editing = true; renderDrawer(); return;
  }
  if (t.id === 'dResetOv') { delete state.overrides[openId]; render(); return; }
  if (t.id === 'ioExport') { $('#ioText').value = JSON.stringify(state, null, 1); flash('Codice generato.'); return; }
  if (t.id === 'ioCopy') {
    const txt = $('#ioText');
    if (!txt.value) txt.value = JSON.stringify(state, null, 1);
    const ok = () => flash('Copiato negli appunti.');
    const fb = () => { txt.focus(); txt.select(); flash('Testo selezionato: copialo con Ctrl/Cmd+C.'); };
    try { navigator.clipboard.writeText(txt.value).then(ok, fb); } catch (err) { fb(); }
    return;
  }
  if (t.id === 'ioImport') {
    try {
      const s = JSON.parse($('#ioText').value);
      if (!s || typeof s !== 'object' || !s.weights) throw new Error();
      state = merge(DEFAULT_STATE(), s); renderPresets(); renderWeights(); syncFilters(); render(); flash('Impostazioni caricate.');
    } catch (err) { flash('Il codice non è valido: incolla il testo generato con "Genera codice".', true); }
    return;
  }
  if (t.id === 'ioReset') {
    if (t.dataset.armed) {
      state = DEFAULT_STATE(); renderPresets(); renderWeights(); syncFilters(); render(); flash('Tutto ripristinato.');
      delete t.dataset.armed; t.textContent = 'Ripristina tutto';
    } else {
      t.dataset.armed = '1'; t.textContent = 'Conferma: cancella tutto';
      setTimeout(() => { delete t.dataset.armed; t.textContent = 'Ripristina tutto'; }, 4000);
    }
    return;
  }
  if (t.id === 'panelToggle') { const p = $('#panel'); p.classList.toggle('open'); t.setAttribute('aria-expanded', p.classList.contains('open')); return; }
  if (t.dataset.open) { openDrawer(t.dataset.open); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && openId) closeDrawer();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.open) openDrawer(e.target.dataset.open);
});
$('#scrim').addEventListener('click', closeDrawer);
function flash(msg, bad) { const m = $('#ioMsg'); if (!m) return; m.textContent = msg; m.style.color = bad ? 'var(--bad)' : 'var(--good)'; }

document.addEventListener('input', e => {
  const t = e.target, f = state.f;
  if (t.id === 'q') f.q = t.value;
  else if (t.id === 'budget') state.budget = t.value;
  else if (t.id === 'rentMax') f.rentMax = Number(t.value);
  else if (t.id === 'janMin') f.janMin = Number(t.value);
  else if (t.id === 'safetyMin') f.safetyMin = Number(t.value);
  else if (t.id === 'homeRent') { state.home.rent = t.value; render(); return; }
  else if (t.id === 'dNotes') { if (t.value.trim()) state.notes[openId] = t.value; else delete state.notes[openId]; save(); return; }
  else return;
  syncFilters(); render();
});
document.addEventListener('change', e => {
  const t = e.target, map = {fNoVisa:'noVisa', fEuro:'euro', fNoIT:'noIT', fSea:'sea', fMount:'mount', fBudget:'budget', fFav:'fav'};
  if (map[t.id]) { state.f[map[t.id]] = t.checked; render(); }
  else if (t.id === 'sort') { state.sort = t.value; render(); }
  else if (t.id === 'fSize') { state.f.size = t.value; render(); }
  else if (t.id === 'homeId') { state.home.id = t.value; render(); }
  else if (t.id === 'cmpAdd' && t.value) { toggleCmp(t.value); render(); }
  else if (t.dataset.ed) {
    const k = t.dataset.ed, v = Number(t.value), base = allBase().find(c => c.id === openId);
    if (t.value === '' || !isFinite(v)) return;
    const o = state.overrides[openId] = state.overrides[openId] || {};
    if (v === base[k]) delete o[k]; else o[k] = v;
    if (!Object.keys(o).length) delete state.overrides[openId];
    render();
    const el = document.getElementById('ed-' + k); if (el) el.focus();
  }
});

const answered = q => { const a = state.quiz[q.id]; return q.type === 'number' ? !!a : q.multi ? Array.isArray(a) && a.length > 0 : a != null; };
function quizProfile(answers) {
  const w = zeroW({}), inv = {}, f = {...DEFAULT_STATE().f};
  let budget = '';
  QUIZ.forEach(q => {
    const a = answers[q.id];
    if (q.type === 'number') { if (a) budget = a; return; }
    if (a == null) return;
    (q.multi ? a : [a]).forEach(i => {
      const set = (q.opts[i] || {}).set || {};
      Object.entries(set.w || {}).forEach(([k, v]) => w[k] = Math.max(w[k], v));
      Object.assign(inv, set.inv || {}); Object.assign(f, set.f || {});
    });
  });
  if (!Object.values(w).some(Boolean)) Object.assign(w, DEFAULT_W);
  return {w, inv, f, budget};
}
function quizPreview() {
  const saved = state, prof = quizProfile(state.quiz);
  state = {...saved, weights: prof.w, inv: prof.inv, f: prof.f, budget: prof.budget || saved.budget};
  compute();
  const top = cities.filter(passes).sort((a, b) => b.score - a.score).slice(0, 3);
  const n = cities.filter(passes).length;
  state = saved; compute();
  return {top, n};
}
function renderQuiz() {
  $('#view-questionario').innerHTML = `<div class="view-head"><div><h2>Il tuo questionario</h2><p>${QUIZ.length} domande, circa tre minuti. Ogni risposta imposta pesi e paletti al posto tuo; alla fine vedi la classifica fatta su di te. Puoi saltare le domande che non ti interessano e cambiare tutto dopo.</p></div></div>
  <form class="quiz" id="quizForm">` + QUIZ.map((q, qi) => {
    const a = state.quiz[q.id];
    let inner;
    if (q.type === 'number') {
      inner = `<input type="number" id="quiz-${q.id}" data-quiz="${q.id}" min="0" step="100" placeholder="es. 2500" value="${esc(a || '')}" aria-label="${esc(q.q)}" style="max-width:240px">`;
    } else {
      inner = `<div class="opts">` + q.opts.map((o, i) => {
        const checked = q.multi ? (a || []).includes(i) : a === i;
        return `<label class="opt"><input type="${q.multi ? 'checkbox' : 'radio'}" name="q-${q.id}" id="q-${q.id}-${i}" data-quiz="${q.id}" value="${i}" ${checked ? 'checked' : ''}><span><b>${esc(o.l)}</b>${o.d ? `<small>${esc(o.d)}</small>` : ''}</span></label>`;
      }).join('') + `</div>`;
    }
    return `<fieldset class="q ${answered(q) ? 'done' : ''}" data-q="${q.id}"><legend><span class="qn">${String(qi + 1).padStart(2, '0')}</span><span>${esc(q.q)}${q.multi ? ' <span class="qtag">più risposte</span>' : ''}</span></legend>${q.h ? `<p class="qh">${esc(q.h)}</p>` : ''}${inner}</fieldset>`;
  }).join('') + `<div class="qfoot" id="quizFoot"></div></form>`;
  renderQuizFoot();
}
function renderQuizFoot() {
  const done = QUIZ.filter(answered).length;
  const pv = done ? quizPreview() : null;
  const pvTxt = pv ? (pv.top.length ? `Per ora in testa: <strong>${pv.top.map(c => esc(c.name)).join(', ')}</strong> · ${pv.n} città rimaste` : 'Con questi paletti non resta nessuna città: allentane qualcuno.') : 'Rispondi alla prima domanda per vedere le prime città.';
  $('#quizFoot').innerHTML = `<div class="prog"><span><strong class="num">${done}</strong> di ${QUIZ.length} risposte · ${pvTxt}</span><div class="bar"><span style="width:${done / QUIZ.length * 100}%"></span></div></div>
    <div class="btns"><button type="button" class="btn" id="quizClear">Azzera risposte</button><button type="button" class="btn primary" id="quizApply" ${done ? '' : 'disabled'}>Vedi la mia classifica</button></div>`;
  document.querySelectorAll('fieldset.q').forEach(fs => fs.classList.toggle('done', answered(QUIZ.find(q => q.id === fs.dataset.q))));
}
function onQuizInput(t) {
  const q = QUIZ.find(x => x.id === t.dataset.quiz);
  if (q.type === 'number') { if (t.value) state.quiz[q.id] = t.value; else delete state.quiz[q.id]; }
  else if (q.multi) { state.quiz[q.id] = [...document.querySelectorAll(`input[name="q-${q.id}"]:checked`)].map(i => Number(i.value)); }
  else state.quiz[q.id] = Number(t.value);
  save(); renderQuizFoot();
}
function applyQuiz() {
  const p = quizProfile(state.quiz);
  state.weights = p.w; state.inv = p.inv; state.f = p.f; if (p.budget) state.budget = p.budget;
  state.myProfile = {w: {...p.w}, inv: {...p.inv}}; state.preset = 'Il mio profilo'; state.sort = 'score';
  renderPresets(); renderWeights(); syncFilters(); render();
  location.hash = 'classifica'; window.scrollTo(0, 0);
}
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.quiz) onQuizInput(e.target); });
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.quiz && e.target.type === 'number') onQuizInput(e.target); });
document.addEventListener('click', e => {
  if (e.target.id === 'quizApply') applyQuiz();
  if (e.target.id === 'quizClear') { state.quiz = {}; save(); renderQuiz(); }
});
